[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard.rails"
version = "0.1.0"
description = "Defensive checks for LLM input and output: PII redaction with Luhn-validated cards, prompt-injection scoring, and policy verdicts. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["guard_rails*"]
